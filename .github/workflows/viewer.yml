name: Deck viewer

on:
  push:
    paths: ['web/**', 'decks/**', 'VERSION', 'scripts/validate-deck.sh', '.github/workflows/viewer.yml']
  pull_request:
    paths: ['web/**', 'decks/**', 'VERSION', 'scripts/validate-deck.sh', '.github/workflows/viewer.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate and build viewer and canonical paper release
        run: pnpm ci:build
      - name: Check Cloudflare packaging without publishing
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec wrangler deploy --dry-run --outdir test-results/deploy
