name: Deck viewer

on:
  push:
    paths: ['web/**', 'decks/**', 'VERSION', '.github/workflows/viewer.yml']
  pull_request:
    paths: ['web/**', 'decks/**', 'VERSION', '.github/workflows/viewer.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Validate unchanged paper release
        run: ../scripts/validate-deck.sh ../decks/lathril/decklist.txt
